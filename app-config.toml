# Foundation application configuration.
# Forks: change app-id. The app's signing key is derived from it, so two apps sharing an
# app-id would share a key.
app-name = "prime-approve"
friendly-app-name = "Prime Approve"
launcher-app-name = "Prime Approve"
description = "Approve or deny agent requests by QR, offline"
icon = "resources/icon.svg"
theme = "resources/theme.json"
app-id = "0xc89f8e722d58df18b853b2eb68c19473"
min-keyos-version = "1.0.0"

[publisher]
name = "Michael McClanahan"
contact-email = ""
support-url = "https://github.com/tnvolman/prime-approve/issues"

[permissions]
template = ["gui-app", "fs-generic"]
"os/security" = ["GetAppSeed"]
# Opens the system QR scanner from the "Scan request" button.
"os/gui-server" = ["ShowModal"]

[[qr-match-rules]]
id = "prime-approve-request"
priority = 4
id-localizations = { en = "Prime Approve request" }
sub-rules = { req = { QR = { regex-pattern = "^primeapprove:v1:", max-len = 800 } } }

[[qr-match-rules]]
id = "prime-approve-pair"
priority = 4
id-localizations = { en = "Prime Approve pairing code" }
sub-rules = { pair = { QR = { regex-pattern = "^primeapprove:pair:v1:", max-len = 800 } } }
